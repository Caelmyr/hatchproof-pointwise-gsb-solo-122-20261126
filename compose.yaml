name: solo125-hatchproof
services:
  desk:
    build:
      context: .
      args:
        HATCHPROOF_DEPS_IMAGE: ${HATCHPROOF_DEPS_IMAGE:-python:3.11-slim}
    image: ${HATCHPROOF_IMAGE:-solo125-hatchproof:1.0}
    network_mode: bridge
    ports:
      - "127.0.0.1:${HATCHPROOF_PORT:-19925}:8000"
    volumes:
      - measurements:/var/lib/hatchproof
    init: true
volumes:
  measurements:
